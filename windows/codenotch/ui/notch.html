<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* ---- Codenotch, Liquid Glass edition ----------------------------------------------------------
     The notch no longer welds itself to the screen edge: it is a glass capsule floating a few pixels
     off it, the way Apple's floating bars do (a bar glued to the corner reads as paint, not glass).
     Material, from LIQUID-GLASS.md at the repo root, adapted to the one thing this window cannot do:
     backdrop-filter only ever sees this page, never the desktop behind the window, so there is no
     lens here. What sells the glass instead is the rest of the recipe — a tinted body that carries the
     legibility, a specular rim that is bright on two opposite corners, an inner edge that is lit on top
     and shaded underneath, a reflection on the corners, and a two-layer shadow.
     Dense content (the hover card) is almost opaque: text on see-through glass tires the eye.
     Nothing animates on its own: a continuous animation in this always-on-top window slows the whole
     compositor (see the arc rules below). */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #root{position:relative;width:100%;height:100%}

  :root{
    --gap:10px;            /* the capsule floats this far off the screen edge */
    --pill-w:64px;         /* its thickness; the ends are fully round */
    --peek:6px;            /* what stays on screen when it tucks away */
    --glass-a:.66;         /* body tint of the capsule: Settings → Glass picks it */
    --card-a:.90;          /* the card is content, so it stays nearly opaque */
    --glass:rgba(24,24,30,var(--glass-a));
    --card-bg:rgba(28,28,34,var(--card-a));
    --label-1:rgba(255,255,255,.96);
    --label-2:rgba(235,235,245,.64);
    --label-3:rgba(235,235,245,.40);
    --fill-1:rgba(255,255,255,.11);
    --fill-2:rgba(255,255,255,.07);
    --fill-3:rgba(255,255,255,.045);
    --sep:rgba(255,255,255,.09);
    /* thickness: light comes in at the top-left and leaves weaker at the bottom */
    --edge:
      inset 0 1px 0 rgba(255,255,255,.26),
      inset 1px 0 0 rgba(255,255,255,.08),
      inset -1px 0 0 rgba(255,255,255,.06),
      inset 0 -1px 0 rgba(255,255,255,.10),
      inset 0 10px 22px -12px rgba(255,255,255,.16),
      inset 0 -12px 22px -14px rgba(0,0,0,.45);
    /* refractive rim: bright on two opposite corners, almost nothing in between */
    --rim:linear-gradient(135deg,
      rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 22%, rgba(255,255,255,.03) 45%,
      rgba(255,255,255,.10) 62%, rgba(255,255,255,.40) 100%);
    /* corner reflections: wide and low (a high peak turns the glass milky) */
    --quinas:
      radial-gradient(90% 55% at 0% 0%, rgba(255,255,255,.15), rgba(255,255,255,.04) 45%, transparent 70%),
      radial-gradient(80% 45% at 100% 100%, rgba(255,255,255,.09), transparent 70%);
    /* "water mirror": the gloss content surfaces get instead of a lens */
    --espelho:linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.02) 22%, transparent 42%);
    --shadow-pill:0 1px 2px rgba(0,0,0,.30), 0 10px 28px rgba(0,0,0,.36);
    --shadow-card:0 3px 8px rgba(0,0,0,.28), 0 18px 40px rgba(0,0,0,.42);
    --ease-out:cubic-bezier(.32,.72,0,1);
    --ease-spring:cubic-bezier(.34,1.4,.64,1);
  }
  body[data-glass="clear"]{--glass-a:.46;--card-a:.84}
  body[data-glass="solid"]{--glass-a:.92;--card-a:.97}
  /* Windows' transparency effects switch off: the glass goes solid, as Reduce Transparency does */
  @media (prefers-reduced-transparency: reduce){ :root,body[data-glass]{--glass-a:.97;--card-a:.98} }
  @media (prefers-contrast: more){
    :root,body[data-glass]{--glass-a:1;--card-a:1;--label-2:rgba(255,255,255,.86);--label-3:rgba(255,255,255,.7);
      --rim:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7))}
  }

  /* The rim is a 1 px border painted with a gradient and cut out with a mask; the corner reflection
     adds light (screen), it never paints white over the tint. */
  #pill::before,#card::before,.h-disc::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    pointer-events:none;z-index:2;
  }
  #pill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--quinas);mix-blend-mode:screen;pointer-events:none;z-index:0}

  /* ---- The capsule, on the right-hand edge (the default; the other edges follow below) ---- */
  #pill{
    position:absolute;right:var(--gap);top:50%;transform:translateY(-50%);isolation:isolate;
    width:var(--pill-w);padding:12px 0 9px;border-radius:calc(var(--pill-w) / 2);
    background:var(--espelho),var(--glass);
    box-shadow:var(--edge),var(--shadow-pill);
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    /* Auto-hide slides the pill, never the window: a transform is the one thing the compositor
       animates without repainting the page */
    transition:transform .34s var(--ease-out), box-shadow .24s ease;
  }
  #pill > *{position:relative;z-index:1}
  .cell{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;padding:4px 0 5px;border-radius:20px;transition:background .2s}
  .cell:hover{background:var(--fill-3)}
  .ringwrap{position:relative;width:48px;height:48px;transition:transform .3s var(--ease-spring)}
  .cell:hover .ringwrap{transform:scale(1.05)}
  .ringwrap.pressed,.cell:hover .ringwrap.pressed{transform:scale(.92)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .ringwrap > svg.reading{filter:drop-shadow(0 0 2.5px rgba(255,255,255,.16))}
  /* The glyph sits in a small glass bead, lit from the top-left, inside the activity arc's radius */
  .glyph{
    position:absolute;inset:11.5px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--label-1);letter-spacing:-.3px;
    background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.22), rgba(255,255,255,.06) 58%, rgba(255,255,255,.03));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 2px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
  }
  .glyph.small{font-size:10px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:15px;height:15px;color:var(--label-1)}
  .glyph .mark svg{width:15px;height:15px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:15px;height:15px;object-fit:contain}
  .glyph img.appicon{width:19px;height:19px;border-radius:5px;object-fit:cover}
  .pct{font-size:12.5px;font-weight:600;color:var(--label-1);font-variant-numeric:tabular-nums;letter-spacing:-.1px;line-height:16px}
  .dim{opacity:.55}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength — the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  /* A hairline between the readings and the padlock */
  .divider{display:block;width:24px;height:1px;background:var(--sep);margin:2px 0 1px}

  /* The padlock at the end of the pill: shut = fixed in place, open = auto-hide */
  .lock{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:13px;
    color:var(--label-3);transition:color .2s,background .2s,transform .2s var(--ease-spring)}
  .lock:hover{color:#fff;background:var(--fill-1);transform:scale(1.08)}
  .lock:active{transform:scale(.92)}
  .lock svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lock .open{display:none}
  body.autohide .lock .shut{display:none}
  body.autohide .lock .open{display:block}

  /* ---- The hover card -------------------------------------------------------------------------
     Floats beside the capsule with a clear gap and no tail: the hovered cell lights up instead.
     #tail stays as an invisible bridge over the gap, so the pointer crossing it is still "inside". */
  #card{
    position:absolute;left:10px;right:calc(var(--gap) + var(--pill-w) + 12px);top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed). */
    max-width:264px;margin-left:auto;border-radius:22px;padding:14px 14px 10px;isolation:isolate;
    background:var(--espelho),var(--card-bg);
    box-shadow:var(--edge),var(--shadow-card);
    color:var(--label-1);
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    display:none;
    --in-x:8px;--in-y:0px;
  }
  /* It arrives sliding out of the capsule and growing, never blinking in */
  #card.show{display:block;animation:surface-in .22s var(--ease-out)}
  @keyframes surface-in{from{opacity:0;transform:translate(var(--in-x),var(--in-y)) scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){#card.show{animation:none}}
  #tail{position:absolute;right:calc(var(--gap) + var(--pill-w) - 2px);width:16px;height:40px;background:transparent;display:none}
  #card.show + #tail{display:block}

  .c-head{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
  .c-icon{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.18), rgba(255,255,255,.05) 62%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 2px rgba(0,0,0,.3)}
  .c-icon .mark{display:block;width:18px;height:18px;color:var(--label-1)}
  .c-icon .mark svg{width:18px;height:18px;fill:currentColor;display:block}
  .c-icon img{display:block}
  .c-id{flex:1;min-width:0}
  .c-title{font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-sub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--label-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-dot{width:6px;height:6px;border-radius:50%;flex:none}
  .c-big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6px;line-height:1;flex:none}
  .c-big small{font-size:12px;font-weight:650;margin-left:1px;opacity:.85;letter-spacing:0}

  .win{padding:9px 2px 8px;border-top:1px solid var(--sep)}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;column-gap:8px}
  .w-label{font-size:12.5px;font-weight:600;color:var(--label-1);white-space:nowrap}
  .w-reset{color:var(--label-2);font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  /* The bar: a recessed track, a fill that glows faintly in its own colour, and the pace mark —
     where the reading would be if the allowance were spent evenly across the window */
  .w-track{position:relative;height:6px;border-radius:3px;background:var(--fill-1);margin:7px 0 5px;box-shadow:inset 0 1px 1.5px rgba(0,0,0,.35)}
  .w-fill{height:100%;border-radius:3px}
  .w-pace{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.88);box-shadow:0 0 0 1.5px rgba(22,22,28,.85)}
  .w-used{font-size:11px;color:var(--label-2);font-variant-numeric:tabular-nums}
  .g-head{font-size:10.5px;font-weight:650;color:var(--label-2);text-transform:uppercase;letter-spacing:.5px;margin:10px 4px 5px}
  .g-box{background:var(--fill-3);border-radius:14px;padding:0 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);margin-bottom:4px}
  .g-box > .win:first-child{border-top:none}
  .c-note{font-size:12px;color:var(--label-2);line-height:1.5;padding:8px 2px 4px;border-top:1px solid var(--sep)}
  .c-sessions{border-top:1px solid var(--sep);padding:7px 2px 2px}
  .s-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--label-2);padding:3px 0;min-width:0}
  .s-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-d{color:var(--label-3);flex:none}
  .s-dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px rgba(255,255,255,.06)}
  .s-more{font-size:11px;color:var(--label-3);padding:2px 0 2px 15px}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the bridge sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:var(--gap)}
  body[data-edge="left"] #card{left:calc(var(--gap) + var(--pill-w) + 12px);right:10px;margin-left:0;margin-right:auto;--in-x:-8px}
  body[data-edge="left"] #tail{right:auto;left:calc(var(--gap) + var(--pill-w) - 2px)}

  /* Top and bottom: the capsule lies flat, so it is a row and its thickness comes from the cells. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:6px 10px 6px 8px;border-radius:30px;gap:4px;
  }
  body[data-edge="top"] #pill{top:var(--gap)}
  body[data-edge="bottom"] #pill{bottom:var(--gap)}
  body[data-edge="top"] .divider,body[data-edge="bottom"] .divider{width:1px;height:26px;margin:0 2px}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:264px;max-height:calc(100% - 140px);--in-x:0px;
  }
  body[data-edge="top"] #card{--in-y:-8px}
  body[data-edge="bottom"] #card{--in-y:8px}
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:40px;height:16px}

  /* ---- The two handles --------------------------------------------------------
     Move above the near end of the capsule, settings below the far one (beside them when it lies
     flat). At rest each is a small mark — a grabber bar for moving, a dot for settings — and under
     the pointer it grows into a glass button carrying its glyph. `placeHandles` centres each box. */
  .handle{position:absolute;width:44px;height:44px;display:none;--rot:0deg}
  .handle.placed{display:block}
  .handle.hover{cursor:pointer}
  .handle > *{position:absolute;left:50%;top:50%;pointer-events:none;transition:opacity .2s,transform .36s var(--ease-spring)}
  .h-rest{width:22px;height:5px;margin:-2.5px 0 0 -11px;border-radius:3px;background:rgba(255,255,255,.42);
    box-shadow:0 0 0 1px rgba(0,0,0,.18),0 1px 4px rgba(0,0,0,.35);transform:rotate(var(--rot))}
  #orb .h-rest{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%}
  .h-disc{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;isolation:isolate;
    background:var(--espelho),rgba(30,30,36,.9);box-shadow:var(--edge),var(--shadow-pill);opacity:0;transform:scale(.55)}
  .h-glyph{width:17px;height:17px;margin:-8.5px 0 0 -8.5px;fill:var(--label-1);opacity:0;
    transform:rotate(calc(var(--spins,0) * 360deg - 60deg)) scale(.5);transition:opacity .2s,transform .55s cubic-bezier(.34,1.2,.64,1)}
  .handle.hover .h-rest{opacity:0;transform:rotate(var(--rot)) scale(.4)}
  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}
  /* Carrying: the button gets a bright ring and the hand stops turning — it is being held now, not offered */
  #move.armed .h-disc{box-shadow:0 0 0 2px rgba(255,255,255,.85),var(--shadow-pill)}
  body[data-edge="top"] .handle,body[data-edge="bottom"] .handle{--rot:90deg}
  @media (prefers-reduced-motion: reduce){.handle > *{transition:none}}

  /* ---- Auto-hide ------------------------------------------------------------
     Tucked, the capsule slides past the screen edge until only --peek of it shows; the pointer on that
     strip brings it back. The handles go with it. The transforms repeat the base ones because a
     transform is one property, not a stack. */
  body.tucked #pill{transform:translateY(-50%) translateX(calc(100% + var(--gap) - var(--peek)));
    box-shadow:var(--edge),0 0 0 1px rgba(255,255,255,.30),var(--shadow-pill)}
  body.tucked[data-edge="left"] #pill{transform:translateY(-50%) translateX(calc(-100% - var(--gap) + var(--peek)))}
  body.tucked[data-edge="top"] #pill{transform:translateX(-50%) translateY(calc(-100% - var(--gap) + var(--peek)))}
  body.tucked[data-edge="bottom"] #pill{transform:translateX(-50%) translateY(calc(100% + var(--gap) - var(--peek)))}
  body.tucked .handle{opacity:0;pointer-events:none}
  .handle{transition:opacity .2s}
  @media (prefers-reduced-motion: reduce){#pill{transition:none}}
</style>
</head>
<body>
<div id="root">
  <div id="card"></div>
  <div id="tail"></div>
  <div id="move" class="handle">
    <span class="h-rest"></span>
    <div class="h-disc"></div>
    <!-- A hand, as on the Mac: the gesture is a carry, not a nudge, which is what arrows would say -->
    <svg class="h-glyph" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 13V5.6a1.5 1.5 0 0 1 3 0V11h.6V3.5a1.5 1.5 0 0 1 3 0V11h.6V5a1.5 1.5 0 0 1 3 0v8.4c0 4.2-2 7.1-5.6 7.1-2.4 0-3.8-1-5.1-2.7l-3.8-5a1.5 1.5 0 0 1 2.2-2z"/>
    </svg>
  </div>
  <div id="orb" class="handle">
    <span class="h-rest"></span>
    <div class="h-disc"></div>
    <svg class="h-glyph" viewBox="0 0 12 12" aria-hidden="true"><path fill-rule="evenodd" d="M5.1.6h1.8l.3 1.5 1.1.5 1.3-.8 1.3 1.3-.8 1.3.5 1.1 1.5.3v1.8l-1.5.3-.5 1.1.8 1.3-1.3 1.3-1.3-.8-1.1.5-.3 1.5H5.1l-.3-1.5-1.1-.5-1.3.8-1.3-1.3.8-1.3-.5-1.1L.6 6.9V5.1l1.5-.3.5-1.1-.8-1.3 1.3-1.3 1.3.8 1.1-.5zM6 4.1a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8z"/></svg>
  </div>
  <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
// Auto-hide state, read by reportHot from the first render on
let autoHide=false, tucked=false, tuckTimer=null;
const LOCK_HTML=`<i class="divider" aria-hidden="true"></i><div class="lock" title="Fixed in place: click to auto-hide"><svg class="shut" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><svg class="open" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg></div>`;
const listen = window.__TAURI__.event.listen;

/* Colour ramp: the system green, yellow and red of Apple's dark palette — saturated enough to read on
   the glass at a glance, without the neon of the old ramp that glowed against dark wallpapers */
const AMPLE='#30D158', WATCH='#FFD60A', CRIT='#FF453A';
// The status arc is neutral on purpose: the ring behind it is coloured by how much of the limit
// is gone, and a green arc inside it reads as part of that scale. Waiting borrows the warning yellow.
const TRACK='rgba(255,255,255,.12)', INK='#ffffff', DIM='rgba(235,235,245,.40)';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;
// The bar's fill: the tone, a touch lighter where it starts, and a faint glow of its own colour
function fillStyle(f){
  const c=tone(f);
  return `background:linear-gradient(90deg,color-mix(in srgb,${c} 72%,#fff),${c});box-shadow:0 0 8px -1px ${c}`;
}
/* The pace mark: how far through its window a limit is, so the bar says whether the allowance is
   being spent faster than the clock. Only for windows whose length is known from their id or label;
   a window it cannot place gets no mark rather than a guess. */
function windowLength(w){
  const t=(String(w.id)+' '+(w.label||'')).toLowerCase();
  let m=t.match(/(\d+)\s*-?\s*h(?:our)?s?\b/); if(m) return +m[1]*3600e3;
  m=t.match(/(\d+)\s*-?\s*d(?:ay)?s?\b/); if(m) return +m[1]*86400e3;
  m=t.match(/(\d+)\s*-?\s*m(?:in)?\s+limit/); if(m) return +m[1]*60e3;
  if(/\bsession\b|five.hour/.test(t)) return 5*3600e3;
  if(/seven_day|week/.test(t)) return 7*86400e3;
  if(/month/.test(t)) return 30*86400e3;
  return 0;
}
function paceOf(w){
  if(!w.resets_at) return null;
  const len=windowLength(w); if(!len) return null;
  const left=w.resets_at-Date.now();
  if(left<=0||left>len) return null;
  return 1-left/len;
}
// Whole percents, except where rounding would read as nothing used or nothing left, as the Mac's Percent does
function smallPct(v){
  if(v<=0) return '0';
  const t=Math.round(v*10)/10;
  if(t<0.1) return '<0.1';
  if(t>99.9) return '>99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }
// Both ends, since vendors disagree on which they print; the left half comes from the rounded used half, as their dashboards do
function usedCopy(w){
  const v=w.used*100;
  let used, left;
  if((v>0&&v<1)||(v>99&&v<100)){ used=smallPct(v); left=100-v>99.9?'>99.9':smallPct(Math.max(0,100-v)); }
  else { const u=Math.round(v); used=String(u); left=String(Math.max(0,100-u)); }
  if(w.derived) used='~'+used;
  return ui().usedLeft(used,left);
}

/* Which screen edge the notch is pinned to. Rust owns it (it is what placed the window); the page is
   told so it can mirror or rotate itself to match. 'right' is the default and the pre-edge layout. */
let notchEdge='right';
/* How much of the window the taskbar covers, in CSS px, from Rust: top, right, bottom, left. The pill
   stays against the screen edge; the card is kept out of these. */
let insets=[0,0,0,0];
function applyInsets(v){
  const next=Array.isArray(v)&&v.length===4?v.map(n=>Math.max(0,Number(n)||0)):[0,0,0,0];
  if(next.every((n,i)=>n===insets[i])) return;
  insets=next;
  if(card&&card.classList.contains('show')){ placeCard(); reportHot(); }
}
// Pushed on every placement, and asked for once in case the placement happened before this page was listening
listen('notch_insets',e=>applyInsets(e.payload)).catch(()=>{});
invoke('get_notch_insets').then(applyInsets).catch(()=>{});
function edgeIsVertical(){ return notchEdge==='left'||notchEdge==='right'; }
function applyEdge(e){
  const next=(e==='left'||e==='top'||e==='bottom')?e:'right';
  if(next===notchEdge) return;
  notchEdge=next;
  document.body.dataset.edge=next;
  // The window changes shape with the edge, and so does the width the zoom correction measures against
  reportDpr();

  if(card&&card.classList.contains('show')) placeCard();
  reportHot();
}

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.mark||p.base||p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}
// Provider table (order = top to bottom in the pill). `glyph` is the fallback letter used when no mark is available
// Which providers get a ring: [{provider}]. null or an empty list means every provider.
let notchSlots=null;
function slotFor(id){
  if(!Array.isArray(notchSlots)) return null;
  for(const s of notchSlots){ if(s&&s.provider===id) return s; }
  return null;
}
// One cell per Claude account. Each account's windows arrive carrying its heading in `group` and,
// past the default account, an `@slug` id; the cell gets that account's windows under the ids they
// would have had on their own, so headlineOf and weeklyOf need no rule about accounts. `base` is the
// provider the cell belongs to (glyph, activity, slot choice); `id` is what makes the cell unique.
function claudeCells(){
  const ws=Array.isArray(usage.windows)?usage.windows:[];
  const accounts=[];
  for(const w of ws){
    const g=w.group||'';
    if(!accounts.some(a=>a.g===g)) accounts.push({g:g,slug:(String(w.id).split('@')[1]||'')});
  }
  // One account (or a reading with no headings yet) is the single cell it has always been
  if(accounts.length<2) return [{id:'claude',base:'claude',name:'Claude',glyph:'C',snap:usage}];
  return accounts.map(a=>({
    id:a.slug?'claude@'+a.slug:'claude',
    base:'claude',
    name:a.g||'Claude',
    glyph:'C',
    snap:Object.assign({},usage,{windows:ws.filter(w=>(w.group||'')===a.g)
      .map(w=>Object.assign({},w,{id:String(w.id).split('@')[0]}))})

function providers(){
  const list=claudeCells();
  if(codexSnap.status!=='absent') list.push({id:'codex',base:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',base:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(grokSnap.status!=='absent') list.push({id:'grok',base:'grok',name:'Grok',glyph:'Gk',snap:grokSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',base:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(gaSnap.status!=='absent') list.push({id:'geminiapp',base:'geminiapp',mark:'geminiapp',name:'Gemini',glyph:'G',snap:gaSnap});
  if(Array.isArray(notchSlots)&&notchSlots.length){
    const picked=list.filter(p=>!!slotFor(p.base));
    // Never leave the notch with nothing in it: an empty result means the choice no longer matches
    // any available provider, so fall back to showing everything rather than an empty pill.
    if(picked.length) return picked;
  }

}
// Antigravity's "Notch reads" and "Model data", as in the Mac app; chosen in settings
let agPrefs={limit:'automatic',model:'gemini'};
// Where the weekly limit's own ring goes, from settings: 'off', 'inside' or 'outside'
let weeklyRing='off';
// The tightest metered window, ties going to the lower id so the choice never flickers
function tightestOf(ws){
  return ws.filter(w=>w.count==null).reduce((a,b)=>!a||b.used>a.used||(b.used===a.used&&b.id<a.id)?b:a,null);
}
function laneFamily(w){ const id=w.id.toLowerCase(); return id.startsWith('gemini')?'gemini':(id.startsWith('3p')||id.startsWith('claude'))?'3p':''; }
function laneIs(w,limit){
  const t=(w.id+' '+w.label).toLowerCase();
  return limit==='weekly'?t.includes('weekly'):['5h','5-hour','five hour','five-hour','hourly','session'].some(k=>t.includes(k));
}
// The window a provider's ring shows: the same rule as ring_window in main.rs, which draws the tray
function headlineOf(snap,id){
  const ws=snap.windows; if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude') return byId('session');
  if(id==='codex') return ws[0];
  if(id==='cursor') return byId('included')||byId('api');
  if(id==='grok') return byId('credits')||ws[0];
  if(id==='geminiapp') return byId('session')||byId('weekly');
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  if(agPrefs.limit!=='automatic'){ const w=tightestOf(lanes.filter(w=>laneIs(w,agPrefs.limit))); if(w) return w; }
  return tightestOf(lanes.filter(w=>w.used<1))||tightestOf(lanes)||lanes[0];
}
// The weekly window each provider reports, or null where there is none: Claude names it seven_day,
// Codex calls its second window secondary, and Antigravity has one per model family. Cursor has none.
function weeklyOf(snap,id){
  const ws=snap.windows.filter(w=>w.count==null); if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude') return byId('seven_day')||byId('weekly_all')||byId('weekly');
  if(id==='codex') return byId('secondary');
  if(id==='cursor') return null;
  if(id==='grok') return null; // the credits window is already the weekly one
  if(id==='geminiapp') return byId('weekly');
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  return tightestOf(lanes.filter(w=>laneIs(w,'weekly')));

// 15 minutes, the Mac's `UsageStore.staleAfter`. At 5 a reading went grey between two polls of a

function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>15*60*1000; }

function svgArc(r,frac,color,width,extra=''){
  // Nothing at all at zero: a zero-length dash still paints a dot once the caps are round, where the
  // Mac's `trim(from: 0, to: 0)` draws nothing. A reading small enough that its two caps meet does
  // draw as a dot, on both platforms — `ProviderRing.sweep` has no floor. Upstream #260 argues that
  // is wrong, for the local model's arc; if it lands, the same floor belongs here.
  if(!(frac>0)) return '';
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function renderRing(){
  const ps=providers();
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor)
  const want=ps.map(p=>p.id+':'+(glyphs[p.mark||p.base]?glyphs[p.mark||p.base].kind:'-')).join(',');
  if(pill.dataset.cells!==want){
    pill.innerHTML=ps.map(p=>`<div class="cell" data-p="${p.id}">
      <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"></svg><svg class="reading" viewBox="0 0 56 56"></svg><svg class="activity" viewBox="0 0 56 56"></svg><div class="glyph ${(!glyphs[p.mark||p.base]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);

}

const STATE_DOT={running:INK,attention:WATCH,done:AMPLE,idle:TRACK};

let hoverId='claude';

    }
  }
  c.innerHTML=html;
  placeCard();
}
// The card follows the hovered cell: centred on it along the pill (kept inside the window), tail pointing at it.
// On the upright edges that means matching its vertical centre; on the flat ones, its horizontal centre,
// and the card is pushed clear of a pill whose thickness follows the cells it holds.
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  // The point sits on the ring, not the cell, which includes the label below it
  const rr=(cell.querySelector('.ringwrap')||cell).getBoundingClientRect();
  card.style.transform='none';
  if(edgeIsVertical()){
    const cy=cr.top+cr.height/2;
    const H=innerHeight, ch=card.offsetHeight||0;
    let top=Math.round(cy-ch/2); top=Math.max(8+insets[0],Math.min(top,H-insets[2]-ch-8));
    card.style.top=top+'px'; card.style.left='';
    const ry=rr.top+rr.height/2;
    const th=tail.offsetHeight||40, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));
    tail.style.top=Math.round(ty-th/2)+'px'; tail.style.left='';
  }else{
    const pr=pill.getBoundingClientRect();
    const cx=cr.left+cr.width/2;
    const W=innerWidth, cw=card.offsetWidth||0, ch=card.offsetHeight||0;
    let left=Math.round(cx-cw/2); left=Math.max(8+insets[3],Math.min(left,W-insets[1]-cw-8));
    card.style.left=left+'px';
    const rx=rr.left+rr.width/2;
    const tw=tail.offsetWidth||40, tx=Math.max(left+16+tw/2,Math.min(left+cw-16-tw/2,rx));
    tail.style.left=Math.round(tx-tw/2)+'px';
    // 12 px of clear gap, the same the upright edges leave, with the invisible bridge spanning it
    // 2 px into the capsule, so the pointer never crosses a strip that belongs to the desktop
    if(notchEdge==='top'){ card.style.top=Math.round(pr.bottom+12)+'px'; tail.style.top=Math.round(pr.bottom-2)+'px'; }
    else{ card.style.top=Math.round(pr.top-12-ch)+'px'; tail.style.top=Math.round(pr.top-14)+'px'; }
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill'), tail=document.getElementById('tail');
let hideTimer=null;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();refreshClock();} // show first, then render: placeCard needs offsetHeight
// Nothing is broadcast when the Windows clock format changes, so ask again each time the card opens
function refreshClock(){
  invoke('get_state').then(s=>{
    if(!s||s.clock_24h===stateSnap.clock_24h) return;
    stateSnap.clock_24h=s.clock_24h;
    if(card.classList.contains('show')) renderCard();
  }).catch(()=>{});
}
function hideCard(){card.classList.remove('show');reportHot();}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  const open=card.classList.contains('show');
  const rects=open?[rectOf(pill),rectOf(tail),rectOf(card)]:[rectOf(pill)];
  // Tucked, the pill's rectangle runs off the window and only the strip that shows is inside it,
  // which is exactly the area that should bring it back; the handles are hidden with it
  if(placeHandles()&&!tucked){ rects.push(rectOf(orb)); if(showMove) rects.push(rectOf(moveHandle)); }
  // An auto-hidden pill that is out asks for pointer_left as the card does, so it knows when to go back
  callq('set_hot',{rects,expanded:open||(autoHide&&!tucked),card:open}).catch(()=>{});
}
function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): Rust sizes and zooms the window so this
// page is as wide as the design, so if the CSS viewport is not that wide the WebView's DPR disagrees
// with the monitor; CSS zoom pulls the layout back to the design size.
// The design width is the window's, and the window is not the same shape on every edge — see
// `notch_window_size` in main.rs: NOTCH_W upright, NOTCH_H lying flat. Dividing by 360 on a flat edge
// read the wider window as a DPR error and zoomed the whole notch by 520/360.
const DESIGN_W_UPRIGHT=360, DESIGN_W_FLAT=520;
function designWidth(){ return edgeIsVertical()?DESIGN_W_UPRIGHT:DESIGN_W_FLAT; }
function fitZoom(){
  const z=innerWidth/designWidth();
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
// Not measured yet: the width to measure against depends on the edge, and only Rust knows it. The
// ask is at the bottom of this file and answers in a round trip; measuring first would zoom a flat
// window by 520/360 for that moment.
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  // Tucked: the window only takes the pointer around the strip (Rust gates click-through); whether
  // it is coming for the notch or only passing over is for `armReveal` to tell
  if(tucked){ armReveal(e.clientX,e.clientY); return; }
  if(autoHide&&pointerInHot(e.clientX,e.clientY)) cancelTuck();
  if(carrying) return; // the notch is in hand; the card would only be in the way
  setHovered(onHandle(e.clientX,e.clientY));
  if(hovered){ if(card.classList.contains('show')){ clearTimeout(hideTimer); hideCard(); } return; }
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();scheduleTuck();}).catch(()=>{});
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget) scheduleTuck(); });
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (refetches that ring). */
let press=null, dragging=false;
/* As on the Mac, a clicked ring presses in until its reading lands, and the reading turns once.
   Each provider's reading listener below calls settle() for its ring; PRESS_MAX is only the fallback.
   Rust answers false when no reading is coming (Claude inside its rate-limit wait). */
const PRESS_MIN=380, PRESS_MAX=6000;
const refreshing={};
function refreshRing(id){
  if(refreshing[id]) return;
  refreshing[id]={at:Date.now(),timer:setTimeout(()=>settle(id),PRESS_MAX)};
  renderRing();
  turnReading(id);
  invoke('refresh_ring',{provider:id}).then(coming=>{if(!coming)settle(id);}).catch(()=>settle(id));
}
// The reading has a layer of its own that renders never replace, turned as a whole element so the
// compositor can run it; it finishes its turn whenever the press lets go
function turnReading(id){
  const el=pill.querySelector(`.cell[data-p="${id}"] svg.reading`);
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(el.getAnimations().some(a=>a.playState==='running')) return;
  el.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:950,easing:'cubic-bezier(.32,0,.14,1)'});
}
function settle(id){
  const r=refreshing[id]; if(!r) return;
  clearTimeout(r.timer);
  const wait=r.at+PRESS_MIN-Date.now();
  if(wait>0){ r.timer=setTimeout(()=>settle(id),wait); return; }
  delete refreshing[id];
  renderRing();
}
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging&&press.id) refreshRing(press.id);
  press=null;
});
// The Mac's right-click menu, naming the ring or card under the pointer; WebView2's own menu never shows
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(dragging||!pointerInHot(e.clientX,e.clientY)) return;
  invoke('show_notch_menu',{provider:cellAt(e.clientX,e.clientY)||hoverId}).catch(err=>notice('show_notch_menu failed: '+err));
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();scheduleTuck();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

/* ---- The handles ----------------------------------------------------------
   Settings past the far end of the pill, move past the near one. Placed whenever the hot rectangles
   are reported, since those follow every change to the pill. Hover is a circle round each handle's
   centre, as on the Mac, not the whole box; the card gives way while either is under the pointer.
   A click on the settings orb opens Settings; holding the move handle carries the notch. */
const orb=document.getElementById('orb'), moveHandle=document.getElementById('move');
const HANDLE_REACH=22; // half of the 44 px box: the hot circle round each handle's centre
const HANDLE_OFF=25;   // from the capsule's end to the handle's centre: clear of the first ring
let orbAt=null, moveAt=null, hovered=null, orbSpins=0, moveSpins=0, showMove=true, carrying=false;
function put(el,x,y,z){
  el.style.left=(x/z-HANDLE_REACH)+'px'; el.style.top=(y/z-HANDLE_REACH)+'px';
  el.classList.add('placed');
  return {x,y,reach:HANDLE_REACH*z};
}
function placeHandles(){
  const r=pill.getBoundingClientRect();
  if(!r.width) return false;
  // Measurements come back zoomed when fitZoom has zoomed the page; styles are written unzoomed
  const z=parseFloat(document.documentElement.style.zoom)||1;
  const off=HANDLE_OFF*z, cx=r.left+r.width/2, cy=r.top+r.height/2;
  // On the capsule's own axis, one past each end: below/above it upright, right/left of it lying flat
  const far=edgeIsVertical()?[cx,r.bottom+off]:[r.right+off,cy];
  const near=edgeIsVertical()?[cx,r.top-off]:[r.left-off,cy];
  orbAt=put(orb,far[0],far[1],z);
  // No point at all when it is switched off, since hover, the press and the hot area all read this
  moveAt=showMove?put(moveHandle,near[0],near[1],z):null;
  if(!showMove) moveHandle.classList.remove('placed','hover');
  return true;
}
function near(at,x,y){ return !!at&&Math.hypot(x-at.x,y-at.y)<=at.reach; }
function onHandle(x,y){ return near(orbAt,x,y)?'orb':near(moveAt,x,y)?'move':null; }
function setHovered(which){
  if(which===hovered) return;
  hovered=which;
  orb.classList.toggle('hover',which==='orb');
  moveHandle.classList.toggle('hover',which==='move'||carrying);
}
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget&&!carrying) setHovered(null); });
orb.addEventListener('click',e=>{
  if(!near(orbAt,e.clientX,e.clientY)) return;
  orb.style.setProperty('--spins',++orbSpins);
  pressIn(orb);
  callq('open_settings').catch(()=>{});
});
// The Mac's press: down fast, back with a little bounce
function pressIn(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.animate([{transform:'scale(1)',easing:'ease-out'},{transform:'scale(.84)',offset:.21,easing:'cubic-bezier(.34,1.56,.64,1)'},{transform:'scale(1)'}],{duration:430});
}
/* Holding the move handle puts the notch in hand: Rust raises the drop zones and follows the pointer
   until the button comes up. The notch itself does not move — what is being chosen is a place on the
   screen, not a distance. The pill's own size goes with it, so a zone is the notch, not a guess. */
/* The shape the zones draw: the pill standing upright, whichever edge it is on now. Worked out from
   the parts it is made of rather than measured, so a notch lying flat still offers the same
   silhouette everywhere — the 64 px depth and the end padding are the capsule's own, from the CSS
   above. The notch really is shallower and shorter lying flat, but drawing that would offer four
   outlines of two sizes, which reads as four different things instead of one notch offered a place. */
function pillShapes(){
  const cells=Math.max(1,pill.querySelectorAll('.cell').length);
  const cell=(pill.querySelector('.cell')||{}).offsetHeight||76;
  const ends=21, between=6, lock=26+1+3+2*between;
  return { depth:64, length:ends+cells*cell+(cells-1)*between+lock };
}
moveHandle.addEventListener('mousedown',e=>{
  if(e.button!==0||!near(moveAt,e.clientX,e.clientY)) return;
  e.stopPropagation();
  carrying=true;
  moveHandle.classList.add('armed','hover');
  moveHandle.style.setProperty('--spins',++moveSpins);
  clearTimeout(hideTimer); hideCard();
  callq('begin_move',pillShapes()).catch(()=>{carrying=false;moveHandle.classList.remove('armed');});
});
listen('move_end',()=>{ carrying=false; moveHandle.classList.remove('armed'); setHovered(null); reportHot(); scheduleTuck(); }).catch(()=>{});
listen('move_handle',e=>{ showMove=e.payload!==false; reportHot(); }).catch(()=>{});
invoke('get_move_handle').then(v=>{ showMove=v!==false; reportHot(); }).catch(()=>{});

listen('usage',e=>{usage=e.payload||usage;settle('claude');renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;settle('codex');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;settle('cursor');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('grok',e=>{grokSnap=e.payload||grokSnap;settle('grok');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_grok').then(u=>{grokSnap=u||grokSnap;renderRing();}).catch(()=>{});

listen('antigravity',e=>{agSnap=e.payload||agSnap;settle('gemini');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
listen('geminiapp',e=>{gaSnap=e.payload||gaSnap;settle('geminiapp');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_gemini_app').then(u=>{gaSnap=u||gaSnap;renderRing();}).catch(()=>{});

/* ---- Auto-hide and the padlock -------------------------------------------
   Auto-hide off (the padlock shut) is the notch as it always was. On, the pill tucks into the edge
   once the pointer has been away for a moment, and comes back when the pointer rests on the strip.
   It never tucks with the card open, mid-drag or while it is being carried. */
const TUCK_AFTER=350;
/* Resting, not touching: on the top edge the strip sits right where a browser's tabs are, so a
   pointer only passing over it on the way to a tab brought the whole notch out every time — which
   reads as a notch that never hides. A click on the strip still brings it out at once. */
const REVEAL_AFTER=180;
/* The slide is .34 s (the #pill transition); the hot rectangles are measured once it has ended */
const SLIDE_MS=380;
let revealTimer=null, revealAt=null;
function applyAutoHide(on){
  autoHide=!!on;
  document.body.classList.toggle('autohide',autoHide);
  const l=pill.querySelector('.lock'); if(l) l.title=autoHide?'Auto-hide on: click to keep the notch in place':'Fixed in place: click to auto-hide';
  if(!autoHide){ cancelTuck(); setTucked(false); }
  else scheduleTuck(900);
  reportHot();
}
function setTucked(t){
  if(t===tucked) return;
  tucked=t;
  cancelReveal();
  if(t){ clearTimeout(hideTimer); card.classList.remove('show'); setHovered(null); }
  document.body.classList.toggle('tucked',t);
  // Measured once the slide has finished, so the strip (or the whole pill) is what gets reported
  setTimeout(reportHot,SLIDE_MS);
}
function reveal(){ cancelTuck(); setTucked(false); }
function cancelTuck(){ clearTimeout(tuckTimer); tuckTimer=null; }
function cancelReveal(){ clearTimeout(revealTimer); revealTimer=null; }
/* Near the strip: what is left of the pill on screen, with the same slack Rust gives it */
function nearStrip(x,y){ return inRect(x,y,pill.getBoundingClientRect(),12); }
function armReveal(x,y){
  revealAt={x,y};
  if(!nearStrip(x,y)){ cancelReveal(); return; } // the window still had the pointer, but it moved on
  if(revealTimer) return;
  revealTimer=setTimeout(()=>{
    revealTimer=null;
    if(tucked&&revealAt&&nearStrip(revealAt.x,revealAt.y)) reveal();
  },REVEAL_AFTER);
}
document.addEventListener('mousedown',e=>{ if(tucked&&e.button===0){ e.stopPropagation(); reveal(); } },true);
document.addEventListener('mouseout',e=>{ if(tucked&&!e.relatedTarget){ revealAt=null; cancelReveal(); } });
/* A timer that is already counting is left to finish. Rust repeats pointer_left every ~300 ms while
   an auto-hidden pill is out and the pointer is away, and each one restarted this 350 ms count from
   zero — a race the tuck could lose for as long as the pointer stayed away. */
function scheduleTuck(after){
  if(!autoHide) return;
  if(tuckTimer&&!after) return;
  cancelTuck();
  tuckTimer=setTimeout(()=>{
    tuckTimer=null;
    if(!autoHide||dragging||carrying||press||card.classList.contains('show')) return;
    setTucked(true);
  },after||TUCK_AFTER);
}
pill.addEventListener('mousedown',e=>{
  if(!e.target.closest('.lock')) return;
  e.stopPropagation(); e.preventDefault(); // not a press on a ring: no refresh, no drag
  if(e.button!==0) return;
  invoke('set_autohide',{on:!autoHide}).then(applyAutoHide).catch(err=>notice('set_autohide failed: '+err));
},true);
listen('autohide',e=>applyAutoHide(e.payload===true)).catch(()=>{});
invoke('get_autohide').then(v=>{ applyAutoHide(v===true); if(v===true) setTucked(true); }).catch(()=>{});
function applyGlass(v){ document.body.dataset.glass=(v==='clear'||v==='solid')?v:'regular'; }
listen('glass',e=>applyGlass(e.payload)).catch(()=>{});
invoke('get_glass').then(applyGlass).catch(()=>{});
invoke('get_notch_slots').then(v=>{if(Array.isArray(v)){notchSlots=v;renderRing();}}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
invoke('get_weekly_ring').then(v=>{if(typeof v==='string'){weeklyRing=v;renderRing();}}).catch(()=>{});
listen('weekly_ring',e=>{if(typeof e.payload==='string'){weeklyRing=e.payload;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});
// applyEdge measures for the edge it is given; on the right-hand one it returns early, so the first
// measurement is made here either way — and still made if the ask fails, from the default edge.
invoke('get_notch_edge').then(e=>{applyEdge(e);reportDpr();}).catch(()=>reportDpr());
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
